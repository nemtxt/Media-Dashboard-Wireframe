name: V3.12 Pastel Dashboard and Settings Isolation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pastel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser test syntax
        run: node --check tests/v312-pastels.cjs
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify pastel cards, settings isolation, themes and breakpoints
        run: node tests/v312-pastels.cjs
