name: V3.14 Typography Contrast and Theme Consistency
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  theme-text:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check tests/v314-text.cjs
      - name: Install browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check text colors and contrast across both themes
        run: node tests/v314-text.cjs
