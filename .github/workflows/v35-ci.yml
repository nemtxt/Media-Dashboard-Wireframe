name: Media Dashboard V3.5 focused regression
on:
  push:
    branches:
      - main
      - develop/media-dashboard-v3-5-refinement
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts compile
        run: |
          node --check refinement-v35.js
          node --check settings-v34.js
      - name: Install test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify interactive V3.5 UI
        run: node tests/v35-refinement.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-ux-captures
          path: test-results/v35-*.png
          if-no-files-found: ignore
