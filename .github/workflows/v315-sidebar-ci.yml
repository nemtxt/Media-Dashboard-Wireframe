name: V3.15 Media Team and Navigation Reference
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sidebar-v315.js
          node --check tests/v315-team-sidebar.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tests/v315-team-sidebar.cjs
