name: V3.11 Display and Filter Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: |
          node --check controls-v311.js
          node --check tests/v311-controls.cjs
          node --check navigation-v310.js
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Test four viewports, filters, theme and navigation
        run: node tests/v311-controls.cjs
