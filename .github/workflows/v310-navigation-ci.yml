name: V3.10 Navigation and Accessibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check navigation-v310.js
          node --check tests/v310-navigation.cjs
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Test desktop and mobile navigation
        run: node tests/v310-navigation.cjs
