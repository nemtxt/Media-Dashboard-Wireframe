name: Media Dashboard V3.9 visual consistency
on:
  push:
    branches:
      - main
      - develop/v3-9-consistency-color-system
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ux-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and test syntax
        run: |
          node --check consistency-v39.js
          node --check tests/v39-consistency.cjs
      - name: Install browser testing runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify all dashboards, visual accents, keyboard access, responsiveness and motion
        run: node tests/v39-consistency.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v39-dashboard-screen-captures
          path: test-results/v39-*.png
          if-no-files-found: ignore
