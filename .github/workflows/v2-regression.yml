name: Media Dashboard V2 regression
on:
  push:
    branches:
      - main
      - develop/media-dashboard-v2
      - develop/media-dashboard-v2-1-centered-modals
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM regression dependency
        run: npm install --no-save --package-lock=false jsdom@26 playwright@1.56.1
      - name: Run interactive UI smoke tests
        run: node tests/v2-smoke.cjs
      - name: Locate system browser
        run: command -v google-chrome || command -v chromium || true
      - name: Test desktop, tablet and mobile layouts
        run: node tests/v2-browser.cjs
      - name: Verify centered modals at all breakpoints
        run: node tests/v2-1-modals.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-viewport-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
