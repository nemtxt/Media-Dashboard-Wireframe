name: Media Dashboard V2 regression
on:
  push:
    branches:
      - main
      - develop/media-dashboard-v2
      - develop/media-dashboard-v2-1-centered-modals
      - develop/media-dashboard-v3-reference-refresh
      - develop/media-dashboard-v3-responsive-audit
      - develop/media-dashboard-v3-1-motion
      - develop/media-dashboard-v3-2-cinematic-intro
      - develop/media-dashboard-v3-3-interaction-lab
      - develop/media-dashboard-v3-4-settings-architecture
      - develop/media-dashboard-v3-5-refinement
      - develop/media-dashboard-v3-6-clean-overview
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM regression dependency
        run: npm install --no-save --package-lock=false jsdom@26 playwright@1.56.1
      - name: Run interactive UI smoke tests
        run: node tests/v2-smoke.cjs
      - name: Locate system browser
        run: command -v google-chrome || command -v chromium || true
      - name: Test desktop, tablet and mobile layouts
        run: node tests/v2-browser.cjs
      - name: Verify centered modals at all breakpoints
        run: node tests/v2-1-modals.cjs
      - name: Validate reference-inspired V3 theme
        run: node tests/v3-design.cjs
      - name: Audit all seven screens for narrow-width overflow
        run: node tests/v3-all-sections.cjs
      - name: Verify creative motion effects and reduced-motion preference
        run: node tests/v31-motion.cjs
      - name: Verify cinematic splash and transition accessibility
        run: node tests/v32-splash.cjs
      - name: Verify V3.3 creative interactions across viewports
        run: node tests/v33-interactions.cjs
      - name: Verify V3.4 settings preferences and Airtable reference catalog
        run: node tests/v34-settings.cjs
      - name: Verify V3.5 refined data interactions and developer credit
        run: node tests/v35-refinement.cjs
      - name: Verify V3.6 simpler navigation and centered landscape previews
        run: node tests/v36-clarity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-viewport-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
