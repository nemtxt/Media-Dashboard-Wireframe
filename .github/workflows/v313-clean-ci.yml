name: V3.13 Clean Cards and Reference Sidebar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check sidebar-v313.js
          node --check tests/v313-clean.cjs
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check white/black cards and navigation at four viewport sizes
        run: node tests/v313-clean.cjs
