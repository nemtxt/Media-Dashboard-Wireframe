name: Media Dashboard V3.8 reference layout
on:
  push:
    branches:
      - main
      - develop/media-dashboard-v3-8-reference-layout
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check workspace-v38.js
          node --check tests/v38-layout.cjs
      - name: Install browser dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Test reference layout, interactive task cards and responsiveness
        run: node tests/v38-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-v38-responsive-screenshots
          path: test-results/v38-*.png
          if-no-files-found: ignore
